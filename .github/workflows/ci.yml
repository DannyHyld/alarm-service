# Pipeline som på Forløb 4, dag 3, slide 32:
# secret scanning -> SAST + unit tests -> build -> deploy til produktion (Azure VM)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install detect-secrets==1.5.0
      - name: Find hardkodede secrets
        run: |
          detect-secrets scan --exclude-files '\.env\.example$' > scan.json
          python -c "import json,sys; r=json.load(open('scan.json'))['results']; print(json.dumps(r, indent=2)); sys.exit(1 if r else 0)"

  test:
    name: SAST og unit tests
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: SAST med Bandit
        run: bandit -r app -ll
      - name: Unit tests
        run: pytest -v

  build:
    name: Build Docker-image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image-navn med små bogstaver (krav fra GHCR)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log ind på GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Byg (og push på main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/alarm-service:latest
            ghcr.io/${{ env.OWNER }}/alarm-service:${{ github.sha }}

  deploy:
    name: Deploy til Azure VM (produktion)
    needs: build
    # Kører kun på main, og først når repo-variablen DEPLOY_ENABLED er sat til true
    # (sættes, når VM'en er oprettet). Ellers springes jobbet over.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      KEY_VAULT_NAME: ${{ secrets.KEY_VAULT_NAME }}
    steps:
      - uses: actions/checkout@v5
      - name: Image-navn
        run: echo "API_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alarm-service:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: SSH-nøgle og kendt host key fra GitHub Secrets
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # tr -d '\r': secrets sat fra Windows kan have CRLF, og så afviser ssh nøglen
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
      - name: Kopiér compose-fil, skema og script til VM'en
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.remote.yml scripts/fetch-secrets.sh "$VM_USER@$VM_HOST:/opt/alarm-service/"
          scp -i ~/.ssh/deploy_key db/init.sql "$VM_USER@$VM_HOST:/opt/alarm-service/db/"
      - name: Log VM'en ind på GHCR (token sendes via stdin)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Hent secrets fra Key Vault og start den nye version
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" "
            set -e
            cd /opt/alarm-service
            bash fetch-secrets.sh '$KEY_VAULT_NAME' .env
            export API_IMAGE='$API_IMAGE'
            docker compose -f docker-compose.remote.yml pull
            docker compose -f docker-compose.remote.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
          "
      - name: Smoke test mod produktion
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://$VM_HOST:5000/health"; then echo; echo "Produktion svarer"; exit 0; fi
            sleep 5
          done
          echo "Health check fejlede efter 150 sekunder"
          exit 1
