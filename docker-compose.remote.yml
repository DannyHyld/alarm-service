# Produktionsmiljø på Azure VM. GitHub Actions (jobbet "deploy") kopierer filen
# til /opt/alarm-service og kører den. .env skrives af scripts/fetch-secrets.sh
# ud fra Azure Key Vault, så ingen secrets ligger i repoet eller i GitHub.
#
# MySQL er ikke åben udefra. Workbench forbinder via SSH-tunnel til VM'en.
services:
  api:
    image: ${API_IMAGE:?API_IMAGE skal sættes af deploy-jobbet}
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"   # kun lokalt på VM'en (SSH-tunnel fra Workbench)
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    environment:
      MP_UI_AUTH: "vagt:${MAILPIT_PASSWORD}"   # web-UI'et kræver login i drift
    restart: unless-stopped
    logging: *logging

  # Observability: Prometheus er kun åben på VM'en selv. Grafana er åben med login.
  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/alarm-service.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
    logging: *logging

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
